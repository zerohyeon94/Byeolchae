# 별채 봇 설정 예시 (SPEC 9.1)
# 이 파일을 bot/projects.yaml로 복사해 실제 값을 채운다. bot/projects.yaml은 커밋하지 않는다 (SPEC Q11)
# 아래 ID·경로는 자리표시 값이다. 경로는 절대 경로이거나 ~로 시작해야 한다

projects:
  gagaessi:                                  # 프로젝트 키: 영문 소문자·숫자·-, 40자 이내
    owner: kappa
    forum_channel_id: "000000000000000000"   # 포럼 채널 ID (따옴표로 감싼 숫자)
    chat_channel_id: "000000000000000001"    # 제품 채팅 채널 ID (ADR-007). 생략하면 채팅을 받지 않는다
    repo: ~/Developer/GagaeSsi               # 앱 저장소 로컬 경로
    github: owner/GagaeSsi                   # GitHub 저장소 (owner/name)
    base_branch: develop                     # main은 쓸 수 없다 (SPEC 9.5)
    test: xcodebuild test -scheme GagaeSsi -destination 'platform=iOS Simulator,name=iPhone 16'
    vault_dir: 일일 예산 관리 앱
    vault_hub: 가게씨.md
    vault_tag: brain/gagaessi
    vault_slug: gagaessi
    design_system_url: null                  # 제품의 Claude 디자인 시스템 링크 (화면 디자인 단계가 참고)
  jday:
    owner: lambda
    forum_channel_id: "000000000000000002"
    chat_channel_id: "000000000000000003"
    repo: ~/Developer/Jday
    github: owner/Jday
    base_branch: develop
    test: xcodebuild build -project Jday.xcodeproj -scheme Jday_macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
    vault_dir: Jday
    vault_hub: Jday.md
    vault_tag: brain/jday
    vault_slug: jday
  orot:
    owner: mu
    forum_channel_id: "000000000000000004"
    chat_channel_id: "000000000000000005"
    repo: ~/Developer/FocusSense
    github: owner/FocusSense
    base_branch: develop
    # 저장소에 iOS Xcode 프로젝트가 들어오면 검증된 테스트 명령을 넣는다
    test: null
    vault_dir: FocusOps
    vault_hub: 집중.md
    vault_tag: brain/focus
    vault_slug: focus

paths:
  vault_projects: ~/Library/Mobile Documents/iCloud~md~obsidian/Documents/vault/Projects
  # 아래는 기본값. 생략할 수 있다. 단일 인스턴스 락은 db와 같은 폴더의 bot.lock이다
  worktrees: ~/.zerosync/worktrees
  runs: ~/.zerosync/runs
  db: ~/.zerosync/zerosync.db
  # 비공개 회사 설정(org.yaml, agents/). 없으면 기본 조직(ADR-007)을 쓴다. 예시는 examples/company
  company: ~/.zerosync/company

# 교육 부서 Daily (ADR-009). 생략하면 교육 일정을 돌리지 않는다
education:
  vault: ~/Library/Mobile Documents/iCloud~md~obsidian/Documents/my-vault
  agent: eta                # 교육팀장 (org.yaml의 에이전트)
  schedule: "30 7 * * *"    # 매일 07:30
  weekly: "0 20 * * 0"      # 주간 학습 보고와 주간 문제, 일요일 20:00
  channel_id: "123456789012345684"   # #교육. 생략하면 #대표실에 알린다
  illustrator: iota         # 개념 노트 그림을 그리는 Codex 팀원. 생략하면 그림 없이 낸다

# 비서 부서 (ADR-010). 없으면 아침 보고는 #대표실에 그대로 간다
secretary:
  vault: ~/Library/Mobile Documents/iCloud~md~obsidian/Documents/my-vault   # Daily/를 쓰는 볼트
  agent: theta              # 비서팀장 (org.yaml의 에이전트)
  schedule: "30 23 * * *"   # 매일 23:30 하루 정리. 놓치면 다음에 켜질 때 그날 몫을 쓴다
  channel_id: "123456789012345685"   # #비서. 생략하면 #대표실에 알린다
  # 토큰 기록 위치 (기본값)
  # claude_projects: ~/.claude/projects
  # codex_sessions: ~/.codex/sessions

# 생략하면 기본값을 쓴다
cli:
  claude: claude        # launchd PATH에서 못 찾으면 절대 경로 (예: /opt/homebrew/bin/claude)
  codex: codex
  # 단계별 모델. 적지 않은 단계는 각 CLI의 기본 모델을 쓴다
  # Claude 단계: opinion, debate, plan, ui_design, design, implement, fix, review,
  #   diagnose, lead_check, release_prep, doc_sync, concept_note, weekly_quiz, secretary_daily
  claude_models:
    opinion: sonnet
    debate: sonnet
    doc_sync: sonnet
    design: opus
    implement: opus
    fix: opus
  # Codex 단계(읽기 전용): opinion, debate, review, diagnose, concept_image
  codex_models: {}

limits:
  max_review_rounds: 3
  max_test_retries: 2
  cli_timeout_sec: 3600
  concurrent_builds: 1
  merge_poll_sec: 300
  remind_after_hours: 24
