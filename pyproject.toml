[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerosync-bot"
version = "0.0.0"
description = "Discord 기반 멀티 에이전트 오케스트레이터 (별채 v2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "discord.py>=2.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
byeolchae = "bot.__main__:main"
zerosync = "bot.__main__:main"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.setuptools.package-data]
# 프롬프트 템플릿 (SPEC 5.3)
"bot.prompts" = ["*.md"]
# 그림 이름표 글자 인식 (ADR-009)
"bot.education" = ["*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # discord.py가 음성 기능용으로 불러오는 모듈 (봇은 음성을 쓰지 않는다)
    "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# 0.16부터 기본 대상에 Markdown이 포함되므로 Python 파일로 한정한다 (docs/ 원문 보존)
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = ["menubar"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 오류
    "W",   # pycodestyle 경고
    "F",   # pyflakes
    "I",   # import 정렬
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
